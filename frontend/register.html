<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create myAadhaar / SetuOne Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body style="background:#f4f6f9;">

<header class="gov-header">
  <a href="index.html" class="gov-brand">
    <svg class="gov-emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 5L15 25V75L50 95L85 75V25L50 5Z" fill="#0D2847"/>
      <circle cx="50" cy="50" r="25" stroke="#FFFFFF" stroke-width="4"/>
      <path d="M50 30V70M30 50H70" stroke="#FF9933" stroke-width="4"/>
    </svg>
    <div class="gov-brand-text">
      <h1>Unique Identification Authority of India</h1>
      <p>Government of India · Registration Gateway</p>
    </div>
  </a>

  <nav class="gov-nav">
    <a href="index.html" style="font-weight:600; color:#0066ff;">← Back to Sign in</a>
  </nav>
</header>

<main class="main-content" style="max-width:540px; padding-top:40px;">
  <div class="card-panel" style="padding:36px;">
    <h2 class="section-title" style="text-align:center; font-size:1.6rem;">Create your myAadhaar Profile</h2>
    <p class="section-desc" style="text-align:center; margin-bottom:24px;">Register once to access every connected government portal without re-submitting identity records.</p>
    
    <div id="err"></div>
    <form id="regForm">
      <div class="form-group">
        <label>Full Name</label>
        <input id="name" class="form-control" required placeholder="e.g. Asha Patil" />
      </div>
      <div class="form-group">
        <label>Aadhaar Number (12 digits)</label>
        <input id="aadhaar" class="form-control" placeholder="1234-5678-9012" />
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input id="mobile" class="form-control" required placeholder="9876543210" />
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input id="dateOfBirth" type="date" class="form-control" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input id="email" type="email" class="form-control" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" class="form-control" required placeholder="••••••••" />
      </div>
      <button class="btn-primary" type="submit" style="width:100%; padding:12px; font-size:1rem; margin-top:8px;">
        Register & Create Profile
      </button>
    </form>
    
    <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:#64748b;">
      Already registered? <a href="/index.html" style="color:#0066ff; font-weight:600; text-decoration:none;">Sign in to myAadhaar</a>
    </p>
  </div>
</main>

<script src="js/api.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: document.getElementById('name').value.trim(),
    aadhaar: document.getElementById('aadhaar').value.trim() || null,
    mobile: document.getElementById('mobile').value.trim(),
    dateOfBirth: document.getElementById('dateOfBirth').value || null,
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  };
  const errBox = document.getElementById('err');
  errBox.innerHTML = '';
  try {
    const { token, user } = await api('/auth/register-citizen', { method: 'POST', body });
    setSession(token, user);
    window.location.href = '/citizen.html';
  } catch (err) {
    errBox.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
});
</script>
</body>
</html>
